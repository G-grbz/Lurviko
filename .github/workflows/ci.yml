name: Build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian-qt68:
    name: Debian 13 / Qt 6.8 (minimum supported Qt)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the container
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          bash packaging/scripts/deps/debian.sh
          apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 ffmpeg 7zip \
            libarchive-tools zstd unzip desktop-file-utils python3 python3-pytest python3-cryptography \
            breeze-icon-theme fonts-dejavu-core qml6-module-qttest
      - name: Build and test as an unprivileged user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c "cd '$GITHUB_WORKSPACE' && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            && cmake --build build --parallel 4 \
            && LURVIKO_TEST_BUILD_DIR=\"\$PWD/build\" bash .github/scripts/run-qt68-tests.sh"

  linux:
    name: Arch Linux / Qt 6 / KDE Frameworks 6
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the container
        run: pacman -Syu --noconfirm --needed git ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: bash .github/scripts/install-arch-deps.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run headless regression tests
        run: bash .github/scripts/run-headless-tests.sh
      - name: Check installation and desktop integration
        run: |
          cmake --install build --prefix /tmp/lurviko-install
          test -x /tmp/lurviko-install/bin/lurviko
          grep -q '^Exec=.' /tmp/lurviko-install/share/applications/lurviko.desktop
          test -f /tmp/lurviko-install/share/icons/hicolor/512x512/apps/lurviko.png
          test -f /tmp/lurviko-install/share/dbus-1/services/org.freedesktop.FileManager1.service
          test -f /tmp/lurviko-install/share/Lurviko/subtitle-ai/worker.py
          desktop-file-validate /tmp/lurviko-install/share/applications/lurviko.desktop
          test ! -e /tmp/lurviko-install/bin/g-file
          test ! -e /tmp/lurviko-install/share/applications/g-file.desktop
          touch /tmp/lurviko-install/share/Lurviko/personal-data-test
          cmake --build build --target uninstall
          test ! -e /tmp/lurviko-install/bin/lurviko
          test ! -e /tmp/lurviko-install/share/applications/lurviko.desktop
          test ! -e /tmp/lurviko-install/share/Lurviko/subtitle-ai/worker.py
          test -f /tmp/lurviko-install/share/Lurviko/personal-data-test
