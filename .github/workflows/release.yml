name: Release Lurviko

# A version tag (v1.6.0 or Lurviko-v1.6.0, matching CMakeLists.txt) publishes:
#   - source archives (.tar, .tar.gz, .zip)
#   - Lurviko-<version>-x86_64.AppImage (+ .zsync for delta updates)
#   - lurviko_<version>-1_amd64.deb      (Debian 13 / Qt 6.8)
#   - lurviko-<version>-1.x86_64.rpm     (Fedora 43+)
#   - lurviko-<version>-1-x86_64.pkg.tar.zst (Arch Linux / Manjaro)
#   - SHA256SUMS covering every file
# Each package is installed and launched on a clean system before publishing.

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Reuse commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Wait for this commit's existing build, tests and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/wait-release-checks.py

  package:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: AppImage
            image: debian:trixie
            artifact: appimage
          - name: deb
            image: debian:trixie
            artifact: deb
          - name: rpm
            image: fedora:43
            artifact: rpm
          - name: Arch package
            image: archlinux:base
            artifact: arch
    defaults:
      run:
        shell: bash
    env:
      LURVIKO_PACKAGE_JOBS: 4
      LURVIKO_PACKAGING_WORK: /tmp/lurviko-package-work
    steps:
      - name: Bootstrap the container
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          elif command -v dnf >/dev/null; then dnf -y install git
          else pacman -Syu --noconfirm --needed git ca-certificates; fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate the tag against CMakeLists.txt
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -nE 's/^project\(Lurviko VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          [[ "$RELEASE_TAG" =~ ^(Lurviko[-_])?v?${version//./\\.}$ ]] || {
            echo "Tag $RELEASE_TAG does not match project version $version" >&2; exit 1; }
      - name: Build the AppImage
        if: matrix.artifact == 'appimage'
        run: |
          bash packaging/scripts/deps/debian.sh
          tools="$(bash packaging/scripts/fetch-appimage-tools.sh /tmp/appimage-tools | tail -1)"
          export PATH="$tools:$PATH" APPIMAGE_EXTRACT_AND_RUN=1
          export LURVIKO_APPDIR=/tmp/lurviko-AppDir
          bash packaging/scripts/build-appimage.sh dist
      - name: Build the .deb
        if: matrix.artifact == 'deb'
        run: |
          bash packaging/scripts/deps/debian.sh
          bash packaging/scripts/build-native.sh deb dist
      - name: Build the .rpm
        if: matrix.artifact == 'rpm'
        run: |
          bash packaging/scripts/deps/fedora.sh
          bash packaging/scripts/build-native.sh rpm dist
      - name: Build the Arch package
        if: matrix.artifact == 'arch'
        run: bash packaging/scripts/build-arch.sh dist
      - name: Keep only the release files
        run: |
          shopt -s nullglob
          mkdir -p upload
          for file in dist/*.AppImage dist/*.AppImage.zsync dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
            cp "$file" upload/
          done
          ls -la upload
          test -n "$(ls upload)"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.artifact }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Install and launch ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: AppImage on Ubuntu 24.04
            image: ubuntu:24.04
            artifact: appimage
            pattern: '*.AppImage'
          - name: deb on Debian 13
            image: debian:trixie
            artifact: deb
            pattern: '*.deb'
          - name: rpm on Fedora 43
            image: fedora:43
            artifact: rpm
            pattern: '*.rpm'
          - name: Arch package on Arch Linux
            image: archlinux:base
            artifact: arch
            pattern: '*.pkg.tar.zst'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: packages
      - name: Install on a clean system and launch
        run: |
          shopt -s nullglob
          files=(packages/${{ matrix.pattern }})
          (( ${#files[@]} == 1 )) || { echo "Expected one package: ${files[*]}" >&2; exit 1; }
          bash packaging/scripts/smoke-test-package.sh "${files[0]}"

  release:
    name: Publish release
    needs: [package, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version and prepare source archives
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          python3 .github/scripts/prepare-release.py
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Checksums for every release file
        run: |
          cd release
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving it.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "Lurviko v${RELEASE_VERSION}" --generate-notes
